<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>فحص صورة</title>
<style>
  body{ margin:0; background:#0b1220; color:#e3ecf7; font-family:Tahoma,Arial,sans-serif; padding:16px; max-width:520px; margin:0 auto; }
  h1{ font-size:19px; } .sub{ color:#8fa3b8; font-size:12px; line-height:1.8; }
  label{ display:block; color:#8fa3b8; font-size:12px; margin:12px 0 5px; }
  input{ width:100%; box-sizing:border-box; padding:12px; border-radius:10px; border:1px solid rgba(122,167,255,.25);
         background:#121c2e; color:#fff; font:16px Tahoma,Arial,sans-serif; direction:ltr; text-align:left; }
  button{ width:100%; margin-top:16px; padding:14px; border:0; border-radius:12px; background:#38d9b9; color:#04241d;
          font:bold 15px Tahoma,Arial,sans-serif; }
  #res{ margin-top:16px; padding:14px; border-radius:12px; font-size:15px; line-height:1.9; display:none; }
</style>
</head>
<body>
<h1>🔍 فحص صورة من كاميرا الأماني</h1>
<div class="sub">انقل ما هو مطبوع في الشريط السفلي للصورة كما هو. إن كان الرمز صحيحاً فالصورة من التطبيق ولم يُغيَّر تاريخها ولا وقتها ولا رقمها.</div>
<label>التاريخ والوقت (مثل 2026-10-09 13:24:55)</label><input id="w" placeholder="2026-10-09 13:24:55">
<label>رقم الصورة (بعد No.)</label><input id="n" placeholder="RUWRPY">
<label>رمز المصوِّر (بعد ID أو DEV)</label><input id="d" placeholder="K7QM">
<label>رمز التحقق (بعد CODE)</label><input id="c" placeholder="ABCD-EFGH">
<button onclick="check()">فحص</button>
<div id="res"></div>
<script>
const KEY_HEX = '__AMANI_KEY__';
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function amaniSha256(bytes){
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length, n = ((l + 9 + 63) >> 6) << 6, m = new Uint8Array(n);
  m.set(bytes); m[l] = 0x80; const bl = l * 8;
  m[n-4] = bl >>> 24; m[n-3] = bl >>> 16; m[n-2] = bl >>> 8; m[n-1] = bl;
  const w = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < n; o += 64){
    for (let i = 0; i < 16; i++) w[i] = (m[o+i*4] << 24) | (m[o+i*4+1] << 16) | (m[o+i*4+2] << 8) | m[o+i*4+3];
    for (let i = 16; i < 64; i++){
      const s0 = r(w[i-15],7) ^ r(w[i-15],18) ^ (w[i-15] >>> 3), s1 = r(w[i-2],17) ^ r(w[i-2],19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for (let i = 0; i < 64; i++){
      const t1 = (h + (r(e,6) ^ r(e,11) ^ r(e,25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((r(a,2) ^ r(a,13) ^ r(a,22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  const out = new Uint8Array(32); H.forEach((v, i) => { out[i*4] = v >>> 24; out[i*4+1] = v >>> 16; out[i*4+2] = v >>> 8; out[i*4+3] = v; });
  return out;
}
function amaniHmac(key, msg){
  const k = new Uint8Array(64); k.set(key.length > 64 ? amaniSha256(key) : key);
  const ip = k.map(x => x ^ 0x36), op = k.map(x => x ^ 0x5c);
  const inner = new Uint8Array(64 + msg.length); inner.set(ip); inner.set(msg, 64);
  const ih = amaniSha256(inner), outer = new Uint8Array(96); outer.set(op); outer.set(ih, 64);
  return amaniSha256(outer);
}
async function sign(text){
  const raw = new Uint8Array(KEY_HEX.match(/../g).map(h => parseInt(h, 16)));
  const mac = amaniHmac(raw, new TextEncoder().encode(text));
  let out = ''; for (let i = 0; i < 8; i++) out += ALPHA[mac[i] % 32];
  return out.slice(0, 4) + '-' + out.slice(4);
}
/* ما يُكتب بالخطأ عادةً: حروف صغيرة، O بدل 0، I بدل 1، مسافات زائدة */
const norm = s => String(s || '').trim().toUpperCase().replace(/\s+/g, '').replace(/O/g, '0').replace(/I/g, '1');
async function check(){
  const when = w.value.trim().replace(/\s+/g, ' ');
  const id = norm(n.value), dev = norm(d.value), code = norm(c.value).replace(/^(.{4})-?(.{4})$/, '$1-$2');
  const ok = (await sign([id, when, dev].join('|'))) === code;
  res.style.display = 'block';
  res.style.background = ok ? 'rgba(56,217,185,0.15)' : 'rgba(225,91,100,0.18)';
  res.innerHTML = ok
    ? '✅ <b>صورة أصلية</b><br>التُقطت ' + when + '<br>رمز المصوِّر ' + dev
    : '❌ <b>الرمز لا يطابق</b><br>إمّا أن الصورة ليست من التطبيق، أو أن أحد البيانات عُدِّل، أو نُقل خطأً — تأكّد من النقل حرفاً حرفاً.';
}
</script>
</body>
</html>
