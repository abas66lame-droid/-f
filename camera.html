<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كاميرا الأماني">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>كاميرا الأماني</title>
<style>
  :root{ --bg:#0b1220; --card:#121c2e; --line:rgba(122,167,255,.18); --txt:#e3ecf7; --dim:#8fa3b8; --acc:#38d9b9; --bad:#e15b64; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--txt); font-family:Tahoma,Arial,sans-serif; }
  body{ padding:calc(14px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
  h1{ font-size:20px; margin:4px 0 2px; }
  .sub{ color:var(--dim); font-size:12px; line-height:1.8; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; }
  button{ display:block; width:100%; border:0; border-radius:12px; padding:14px; font:bold 15px Tahoma,Arial,sans-serif;
          color:#04241d; background:var(--acc); cursor:pointer; }
  button.sec{ background:#22324a; color:var(--txt); }
  button.shoot{ font-size:19px; padding:22px; }
  input[type=text]{ width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0b1220;
                    color:var(--txt); font:15px Tahoma,Arial,sans-serif; }
  label{ display:block; color:var(--dim); font-size:12px; margin:10px 0 5px; }
  img.prev{ width:100%; border-radius:10px; display:block; margin-bottom:10px; background:#000; }
  .tabs{ display:flex; gap:6px; margin-top:12px; }
  .tabs button{ padding:10px; font-size:13px; background:#22324a; color:var(--txt); }
  .tabs button.on{ background:var(--acc); color:#04241d; }
  .hidden{ display:none !important; }
  .no{ color:var(--bad); }
  .busy{ text-align:center; color:var(--dim); padding:18px; }
</style>
</head>
<body>
<h1>📷 كاميرا الأماني</h1>
<div class="sub">كل صورة تُختم بعلامة مائية على كامل الصورة: اسم الشركة واسم المصوِّر والتاريخ والوقت ورقم الصورة</div>

<div class="tabs">
  <button id="tCam" class="on" onclick="tab('cam')">📷 تصوير</button>
  <button id="tSet" onclick="tab('set')">⚙️ الإعدادات والسجل</button>
</div>

<div id="pCam">
  <div class="card">
    <input id="camIn" type="file" accept="image/*" capture="environment" class="hidden">
    <button class="shoot" onclick="shoot()">📸 التقط صورة</button>
    <div id="who" class="sub" style="margin-top:10px;text-align:center;"></div>
  </div>
  <div id="busy" class="busy hidden">⏳ جاري ختم الصورة…</div>
  <div id="outCard" class="card hidden">
    <img id="outImg" class="prev" alt="">
    <div id="outInfo" class="sub" style="text-align:center;margin-bottom:10px;"></div>
    <button onclick="saveOut()">💾 حفظ في الهاتف</button>
    <div class="sub" style="margin-top:8px;text-align:center;">في الآيفون اختر «حفظ الصورة» (Save Image) من القائمة</div>
  </div>
</div>

<div id="pSet" class="hidden">
  <div class="card">
    <label>اسم المصوِّر</label>
    <input id="sName" type="text" placeholder="مثلاً: علي حسن">
    <label>نص العلامة المائية</label>
    <input id="sMark" type="text" placeholder="شركة الأماني">
    <div style="height:12px"></div>
    <button onclick="saveSet()">حفظ</button>
  </div>
  <div class="card">
    <b style="font-size:13px;">سجل الصور على هذا الهاتف</b>
    <div class="sub" style="margin-bottom:6px;">كل صورة لها رقم مطبوع عليها — ابحث عنه هنا لتعرف متى ومن صوّرها</div>
    <input id="q" type="text" placeholder="ابحث برقم الصورة" oninput="fillHist()">
    <div id="hist" class="sub" style="margin-top:8px;"></div>
  </div>
</div>

<script>
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + '  ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
const cfg = () => ({ name: LS.get('wmName', ''), mark: LS.get('wmMark', '') || 'شركة الأماني' });
const hist = () => { try{ return JSON.parse(LS.get('wmHist', '[]')); }catch(e){ return []; } };

function tab(t){
  pCam.classList.toggle('hidden', t !== 'cam'); pSet.classList.toggle('hidden', t !== 'set');
  tCam.classList.toggle('on', t === 'cam'); tSet.classList.toggle('on', t === 'set');
  if (t === 'set'){ sName.value = cfg().name; sMark.value = LS.get('wmMark', ''); fillHist(); }
}
function fillHist(){
  const s = (q.value || '').trim().toUpperCase();
  const h = hist().filter(x => !s || x.s.includes(s));
  document.getElementById('hist').innerHTML = h.length
    ? h.slice(0, 50).map(x => '<b>' + x.s + '</b> — ' + esc(x.t) + ' — ' + esc(x.n || '')).join('<br>')
    : 'لا يوجد';
}
function saveSet(){
  LS.set('wmName', sName.value.trim()); LS.set('wmMark', sMark.value.trim());
  showWho(); alert('حُفظت الإعدادات');
}
function showWho(){
  const c = cfg();
  who.innerHTML = c.name ? 'المصوِّر: <b>' + esc(c.name) + '</b>'
    : '<span class="no">اكتب اسمك من «⚙️ الإعدادات» أولاً</span>';
}
function shoot(){
  if (!cfg().name){ alert('اكتب اسم المصوِّر من الإعدادات أولاً'); tab('set'); return; }
  camIn.value = ''; camIn.click();
}

/* رقم الصورة: حروف وأرقام سهلة القراءة بلا التباس (لا O/0 ولا I/1) */
function serial(){
  const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const b = new Uint8Array(6); crypto.getRandomValues(b);
  return Array.from(b, x => A[x % A.length]).join('');
}

/* ═══ الختم ═══
   ١) نص الشركة مائل ومكرّر على كامل الصورة بشفافية متوسطة وحدّ داكن — يُرى على أي خلفية
      ولا يمكن قصّه دون قصّ الصورة نفسها.
   ٢) شريط سفلي ثابت: الشركة، المصوِّر، التاريخ والوقت بالثانية، رقم الصورة. */
async function stamp(file){
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file));
  const MAX = 2400, k = Math.min(1, MAX / Math.max(bmp.width, bmp.height));
  const W = Math.round(bmp.width * k), H = Math.round(bmp.height * k);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.drawImage(bmp, 0, 0, W, H);

  const c = cfg(), now = new Date(), id = serial(), when = fmt(now);
  const u = Math.max(W, H) / 100;            /* وحدة قياس نسبية لحجم الصورة */

  /* ١) التكرار المائل */
  const tileTxt = c.mark + '  •  ' + c.name + '  •  ' + id;
  g.save();
  g.translate(W / 2, H / 2); g.rotate(-Math.PI / 6);
  g.font = 'bold ' + Math.round(u * 3.2) + 'px Tahoma, Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const tw = g.measureText(tileTxt).width + u * 8, th = u * 9, R = Math.hypot(W, H);
  for (let y = -R; y <= R; y += th){
    const off = (Math.round(y / th) % 2) * tw / 2;
    for (let x = -R - tw; x <= R + tw; x += tw){
      g.lineWidth = Math.max(2, u * 0.35);
      g.strokeStyle = 'rgba(0,0,0,0.30)'; g.strokeText(tileTxt, x + off, y);
      g.fillStyle = 'rgba(255,255,255,0.32)'; g.fillText(tileTxt, x + off, y);
    }
  }
  g.restore();

  /* ٢) الشريط السفلي */
  const bh = u * 11;
  g.fillStyle = 'rgba(8,14,26,0.82)'; g.fillRect(0, H - bh, W, bh);
  g.fillStyle = '#38d9b9'; g.fillRect(0, H - bh, W, Math.max(2, u * 0.35));
  g.textBaseline = 'middle'; g.direction = 'rtl';
  g.textAlign = 'right'; g.fillStyle = '#ffffff';
  g.font = 'bold ' + Math.round(u * 3.4) + 'px Tahoma, Arial, sans-serif';
  g.fillText(c.mark, W - u * 3, H - bh * 0.68);
  g.font = Math.round(u * 2.6) + 'px Tahoma, Arial, sans-serif';
  g.fillStyle = '#cfe0f5';
  g.fillText('المصوِّر: ' + c.name, W - u * 3, H - bh * 0.28);
  g.textAlign = 'left'; g.direction = 'ltr';
  g.font = 'bold ' + Math.round(u * 2.8) + 'px Tahoma, Arial, sans-serif';
  g.fillStyle = '#ffffff';
  g.fillText(when, u * 3, H - bh * 0.68);
  g.fillStyle = '#38d9b9';
  g.fillText('No. ' + id, u * 3, H - bh * 0.28);

  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
  const h = hist(); h.unshift({ s: id, t: when, n: c.name }); LS.set('wmHist', JSON.stringify(h.slice(0, 1000)));
  return { blob, id, when };
}

let OUT = null;
camIn.addEventListener('change', async () => {
  const f = camIn.files && camIn.files[0]; if (!f) return;
  outCard.classList.add('hidden'); busy.classList.remove('hidden');
  try{
    OUT = await stamp(f);
    outImg.src = URL.createObjectURL(OUT.blob);
    outInfo.innerHTML = 'رقم الصورة <b>' + OUT.id + '</b> — ' + OUT.when;
    outCard.classList.remove('hidden');
  }catch(e){ alert('تعذّر ختم الصورة: ' + (e && e.message || e)); }
  busy.classList.add('hidden');
});

/* الحفظ: قائمة المشاركة (فيها «حفظ الصورة») — وإلا تنزيل مباشر */
async function saveOut(){
  if (!OUT) return;
  const file = new File([OUT.blob], 'Amani-' + OUT.id + '.jpg', { type: 'image/jpeg' });
  try{
    if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file] }); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}
showWho();
</script>
</body>
</html>
