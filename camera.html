<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="كاميرا الأماني">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1220">
<title>كاميرا الأماني</title>
<style>
  :root{ --bg:#0b1220; --card:#121c2e; --line:rgba(122,167,255,.18); --txt:#e3ecf7; --dim:#8fa3b8; --acc:#38d9b9; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; background:var(--bg); color:var(--txt); font-family:Tahoma,Arial,sans-serif; }
  body{ padding:calc(14px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom)); max-width:560px; margin:0 auto; }
  h1{ font-size:20px; margin:4px 0 2px; }
  .sub{ color:var(--dim); font-size:12px; line-height:1.8; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin:12px 0; }
  .btn{ display:block; width:100%; border:0; border-radius:12px; padding:14px; font:bold 15px Tahoma,Arial,sans-serif;
        color:#04241d; background:var(--acc); cursor:pointer; text-align:center; }
  .shoot{ font-size:19px; padding:24px; }
  /* حقل الملف مخفيّ بصرياً لا بـ display:none — الآيفون يتجاهل أحياناً فتح حقل مخفي كلياً */
  .vh{ position:absolute; width:1px; height:1px; opacity:0; overflow:hidden; }
  img.prev{ width:100%; border-radius:10px; display:block; margin-bottom:10px; background:#000; }
  .hidden{ display:none !important; }
  .busy{ text-align:center; color:var(--dim); padding:18px; }
</style>
</head>
<body>
<h1>📷 كاميرا الأماني</h1>
<div class="sub">كل صورة تُختم تلقائياً بعلامة الشركة والتاريخ والوقت ورقم الصورة ورمز تحقّق</div>

<div class="card">
  <!-- الزر label مرتبط بالحقل مباشرة — أضمن طريقة لفتح الكاميرا في سفاري والتطبيق المثبّت -->
  <input id="camIn" class="vh" type="file" accept="image/*" capture="environment">
  <label for="camIn" class="btn shoot">📸 التقط صورة</label>
  <div id="dev" class="sub" style="margin-top:10px;text-align:center;"></div>
</div>
<div id="busy" class="busy hidden">⏳ جاري ختم الصورة…</div>
<div id="outCard" class="card hidden">
  <img id="outImg" class="prev" alt="">
  <button class="btn" onclick="saveOut()">💾 حفظ في الهاتف</button>
  <div class="sub" style="margin-top:8px;text-align:center;">في الآيفون اختر «حفظ الصورة» (Save Image) من القائمة</div>
</div>

<script>
/* ═══ المفتاح السرّي ═══
   يُستعمل لحساب «رمز التحقق» المطبوع على كل صورة. صفحة الفحص (verify.html) وحدها تعرفه
   فتعيد الحساب وتقارن: أي تعديل على التاريخ أو الوقت أو رقم الصورة أو الجهاز يكسر الرمز.
   لا تضع هذا الملف بمفتاحه في مستودع عام. */
const KEY_HEX = '__AMANI_KEY__';
const MARK = 'شركة الأماني';

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
const pad = n => String(n).padStart(2, '0');
const fmt = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   /* بلا O/0 ولا I/1 — لا التباس عند القراءة */
function rnd(n){ const b = new Uint8Array(n); crypto.getRandomValues(b); return Array.from(b, x => ALPHA[x % 32]).join(''); }

/* رمز الجهاز: يُنشأ مرة واحدة لكل هاتف — تعرف منه أي هاتف التقط الصورة */
let DEV = LS.get('wmDev', '');
if (!DEV){ DEV = rnd(4); LS.set('wmDev', DEV); }
document.getElementById('dev').textContent = 'رمز هذا الجهاز: ' + DEV;

async function sign(text){
  const raw = new Uint8Array(KEY_HEX.match(/../g).map(h => parseInt(h, 16)));
  const key = await crypto.subtle.importKey('raw', raw, { name:'HMAC', hash:'SHA-256' }, false, ['sign']);
  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(text)));
  let out = ''; for (let i = 0; i < 8; i++) out += ALPHA[mac[i] % 32];
  return out.slice(0, 4) + '-' + out.slice(4);
}

/* الصورة تُقرأ بعنصر img (يحترم اتجاه الكاميرا في كل الأجهزة) */
function loadImg(file){
  return new Promise((res, rej) => {
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => res(im); im.onerror = () => rej(new Error('تعذّر قراءة الصورة'));
    im.src = url;
  });
}

async function stamp(file){
  const im = await loadImg(file);
  const MAX = 2400, k = Math.min(1, MAX / Math.max(im.naturalWidth, im.naturalHeight));
  const W = Math.round(im.naturalWidth * k), H = Math.round(im.naturalHeight * k);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.drawImage(im, 0, 0, W, H);

  const id = rnd(6), when = fmt(new Date());
  const code = await sign([id, when, DEV].join('|'));
  const u = Math.max(W, H) / 100;

  /* ١) نص الشركة مائل ومكرّر على كامل الصورة */
  const tile = MARK + '  •  ' + id;
  g.save(); g.translate(W / 2, H / 2); g.rotate(-Math.PI / 6);
  g.font = 'bold ' + Math.round(u * 3.4) + 'px Tahoma, Arial, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const tw = g.measureText(tile).width + u * 8, th = u * 9, R = Math.hypot(W, H);
  g.lineWidth = Math.max(2, u * 0.35);
  for (let y = -R; y <= R; y += th){
    const off = (Math.round(y / th) % 2) * tw / 2;
    for (let x = -R - tw; x <= R + tw; x += tw){
      g.strokeStyle = 'rgba(0,0,0,0.30)'; g.strokeText(tile, x + off, y);
      g.fillStyle = 'rgba(255,255,255,0.32)'; g.fillText(tile, x + off, y);
    }
  }
  g.restore();

  /* ٢) الشريط السفلي: الشركة، التاريخ والوقت، رقم الصورة، الجهاز، رمز التحقق */
  const bh = u * 12;
  g.fillStyle = 'rgba(8,14,26,0.85)'; g.fillRect(0, H - bh, W, bh);
  g.fillStyle = '#38d9b9'; g.fillRect(0, H - bh, W, Math.max(2, u * 0.35));
  g.textBaseline = 'middle';
  g.direction = 'rtl'; g.textAlign = 'right'; g.fillStyle = '#ffffff';
  g.font = 'bold ' + Math.round(u * 3.6) + 'px Tahoma, Arial, sans-serif';
  g.fillText(MARK, W - u * 3, H - bh * 0.66);
  g.direction = 'ltr'; g.textAlign = 'left';
  g.font = 'bold ' + Math.round(u * 2.8) + 'px Tahoma, Arial, sans-serif';
  g.fillText(when, u * 3, H - bh * 0.72);
  g.font = Math.round(u * 2.4) + 'px Tahoma, Arial, sans-serif';
  g.fillStyle = '#cfe0f5';
  g.fillText('No. ' + id + '   DEV ' + DEV, u * 3, H - bh * 0.42);
  g.fillStyle = '#38d9b9';
  g.font = 'bold ' + Math.round(u * 2.4) + 'px Tahoma, Arial, sans-serif';
  g.fillText('CODE ' + code, u * 3, H - bh * 0.15);

  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
  return { blob, id };
}

let OUT = null;
camIn.addEventListener('change', async () => {
  const f = camIn.files && camIn.files[0]; if (!f) return;
  outCard.classList.add('hidden'); busy.classList.remove('hidden');
  try{
    OUT = await stamp(f);
    outImg.src = URL.createObjectURL(OUT.blob);
    outCard.classList.remove('hidden');
  }catch(e){ alert('تعذّر ختم الصورة: ' + ((e && e.message) || e)); }
  busy.classList.add('hidden');
  camIn.value = '';
});

async function saveOut(){
  if (!OUT) return;
  const file = new File([OUT.blob], 'Amani-' + OUT.id + '.jpg', { type:'image/jpeg' });
  try{
    if (navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file] }); return; }
  }catch(e){ if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
}
</script>
</body>
</html>
